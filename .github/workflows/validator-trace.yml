# Validator-Trace-Recorder: zeichnet den Validations-Stream der dUNL dauerhaft auf.
# Läuft als geplanter Job (max. 5 h je Lauf, Actions-Limit 6 h). Die Warteschlange
# (concurrency, kein Abbruch) verhindert parallele Läufe. Lücken zwischen Läufen (Startverzug)
# werden vom Recorder als 'gap' gespeichert, nie als 'alles ok' interpretiert.
#
# Speicherweg: Das Daten-Repo honeypot-xrpl-history wird per DEPLOY-KEY geklont (Secret
# HISTORY_DEPLOY_KEY, Schreibrecht NUR auf dieses Repo). Der Recorder schreibt die Tagesdateien
# in den Klon; danach ein Commit und Push. Kein Token mit Zugriff auf andere Repos nötig.
# Das Deploy-Repo selbst bekommt keinen Commit, also kein Vercel-Redeploy.
name: Validator-Trace-Recorder

on:
  schedule:
    - cron: "5 */5 * * *"
  workflow_dispatch:
    inputs:
      run_seconds:
        description: "Laufzeit in Sekunden (Test: 120, Betrieb: 18000)"
        required: false
        default: "18000"

permissions:
  contents: read

concurrency:
  group: validator-trace
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - name: Checkout (Deploy-Repo, Code)
        uses: actions/checkout@v4

      - name: Node 22 (globales WebSocket)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Deploy-Key prüfen
        env:
          KEY: ${{ secrets.HISTORY_DEPLOY_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "Secret HISTORY_DEPLOY_KEY fehlt – ohne Ziel-Repo würde der Recorder Daten verlieren."
            exit 1
          fi

      - name: Daten-Repo klonen (Deploy-Key)
        uses: actions/checkout@v4
        with:
          repository: Krypto-Whitehat/honeypot-xrpl-history
          ref: main
          path: history
          ssh-key: ${{ secrets.HISTORY_DEPLOY_KEY }}

      - name: Recorder + periodischer Push (alle 5 min, nicht erst am Laufende)
        env:
          TRACE_DATA_DIR: ${{ github.workspace }}/history/data/validator-trace
          TRACE_RUN_SECONDS: ${{ github.event.inputs.run_seconds || '18000' }}
        run: |
          # Der Recorder schreibt lokal in den Daten-Klon (atomar via tmp+rename).
          # Eine Push-Schleife committed/pusht alle 5 min: Sichtbarkeit im Overlay
          # in <= 5 min statt erst nach 5 h, und bei Runner-Verlust gehen maximal
          # 5 min Aufzeichnung verloren statt des ganzen Laufs.
          git -C history config user.name "validator-trace-recorder"
          git -C history config user.email "validator-trace-recorder@users.noreply.github.com"
          node monitor/validator-trace.mjs &
          REC=$!
          push_flush() {
            cd history || return 0
            mkdir -p data/validator-trace
            git add data/validator-trace
            if ! git diff --cached --quiet; then
              git commit -q -m "trace: recorder $(date -u +%FT%TZ)"
              git pull --rebase -q || git pull --rebase -q || true
              git push -q || echo "Push fehlgeschlagen, nächster Takt versucht erneut"
              echo "Trace-Daten gepusht"
            fi
            cd ..
          }
          while kill -0 "$REC" 2>/dev/null; do
            sleep 300
            push_flush
          done
          wait "$REC"; CODE=$?
          push_flush
          exit $CODE
