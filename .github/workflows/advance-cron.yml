# Trigger für den Live-Ledger-Walk: ruft POST /api/advance alle 5 Minuten auf.
# Kein Secret nötig — der Endpunkt ist ein öffentlicher POST; die GitHub-Token
# für das Datenrepo liegt ausschließlich als ENV GITHUB_HISTORY_TOKEN im
# Vercel-Projekt (fail-closed 503 ohne Token, api/advance.js).
#
# Warum GitHub Actions und nicht vercel.json crons: der Hobby-Plan erlaubt laut
# Vercel-Doku nur Cron-Expressions mit höchstens 1 Lauf pro Tag; häufigere
# Expressions lassen den Deploy fehlschlagen (README, Abschnitt Cron-Trigger).
# GitHub Actions funktioniert unabhängig vom Vercel-Plan; 5 min ist die
# kleinste erlaubte Scheduling-Frequenz.
#
# VERSSETZTE TRIGGER (2026-10-02): drei Workflows (Offsets 0/2/4) ergeben
# zusammen einen Tick alle ~100 s — nötig, damit der Walk mit Budget 100
# Blöcke/Tick die Blockrate (~12,6–15,3 Blöcke/min) hält und Rückstand
# aufholt. Der gemeinsame concurrency-group 'advance-tick' mit
# cancel-in-progress:false stellt sicher, dass NIE zwei Walks parallel
# laufen (dritter Tick in der Gruppe wird queued, nicht verworfen).
name: Advance-Trigger A (Live-Walk alle 5 Minuten, Offset 0)

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: advance-tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: POST /api/advance
        run: |
          code=$(curl -s -o response.json -w "%{http_code}" -X POST https://honeypot-xrpl.vercel.app/api/advance)
          echo "HTTP $code"
          cat response.json
          # 200 = Tick gelaufen; 503 = fail-closed (Vercel-ENV GITHUB_HISTORY_TOKEN fehlt) —
          # beides dokumentiert; der Workflow scheitert nur bei Transport-/5xx-Fehlern außer 503.
          if [ "$code" != "200" ] && [ "$code" != "503" ]; then exit 1; fi
