# Versetzter Trigger C (Offset 4/9/14/…): zusammen mit advance-cron.yml
# (Offset 0) und advance-cron-b.yml (Offset 2) ergibt sich ein Advance-Tick
# alle ~100 s. Gemeinsamer concurrency-group 'advance-tick' mit
# cancel-in-progress:false — nie zwei parallele Walks (dritter Tick wird
# queued). Kein Secret nötig (öffentlicher POST; GITHUB_HISTORY_TOKEN liegt
# ausschließlich als Vercel-ENV, api/advance.js fail-closed 503 ohne Token).
name: Advance-Trigger C (Live-Walk alle 5 Minuten, Offset 4)

on:
  schedule:
    - cron: "4,9,14,19,24,29,34,39,44,49,54,59 * * * *"
  workflow_dispatch:

# Kette braucht Actions:write auf GITHUB_TOKEN. Repo-Default ist "read"
# (gemessen: GET /actions/permissions/workflow ->
# default_workflow_permissions "read"); der permissions-Block überschreibt
# den Default (Doku workflow-syntax.md:354).
permissions:
  actions: write

concurrency:
  group: advance-tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: POST /api/advance
        run: |
          code=$(curl -s -o response.json -w "%{http_code}" -X POST https://honeypot-xrpl.vercel.app/api/advance)
          echo "HTTP $code"
          cat response.json
          # 200 = Tick gelaufen; 503 = fail-closed (Vercel-ENV GITHUB_HISTORY_TOKEN fehlt) —
          # beides dokumentiert; der Workflow scheitert nur bei Transport-/5xx-Fehlern außer 503.
          if [ "$code" != "200" ] && [ "$code" != "503" ]; then exit 1; fi
          echo "tick_code=$code" >> "$GITHUB_ENV"
      - name: Kette (lag-gated, selbstheilend)
        continue-on-error: true
        env:
          ADVANCE_CHAIN: ${{ vars.ADVANCE_CHAIN }}
          CHAIN_TOKEN: ${{ secrets.ADVANCE_CHAIN_TOKEN }}
        run: |
          # Kill-Switch: Repo-Variable ADVANCE_CHAIN=off stoppt die Kette.
          if [ "${ADVANCE_CHAIN:-on}" = "off" ]; then echo "Kette aus (Kill-Switch)"; exit 0; fi
          # GITHUB_TOKEN allein darf workflow_dispatch nicht auslösen (live
          # 05.10.2026 gemessen: dispatch HTTP 401) — die Kette nutzt das
          # Repo-Secret ADVANCE_CHAIN_TOKEN (Scope workflow). Ohne Secret:
          # keine Kette, die drei Crons bleiben der Backstop.
          if [ -z "$CHAIN_TOKEN" ]; then echo "kein CHAIN_TOKEN -> keine Kette (Cron-Backstop)"; exit 0; fi
          # Kette nur auf Erfolgspfad: 502/503-Ticks verlängern nicht.
          if [ "$tick_code" != "200" ]; then echo "Tick $tick_code -> keine Kette (Cron-Backstop)"; exit 0; fi
          # Spin-Schutz (Prüfer 3): +0-Tick MIT Fehlerfeld (Netzwerk-/RPC-
          # Fehler, nicht Live-Edge) dispatcht nicht weiter — Crons übernehmen.
          # +0 ohne Fehlerfeld ist legitimer Live-Edge und darf weiterketten.
          if grep -q '"summary":"+0 ' response.json && grep -q 'Fehler:' response.json; then
            echo "+0-Tick mit Fehler -> keine Kette (Cron-Backstop)"
            exit 0
          fi
          cursor=$(grep -o '"cursor":[0-9]*' response.json | head -1 | cut -d: -f2)
          if [ -z "$cursor" ]; then echo "kein cursor in Antwort -> keine Kette"; exit 0; fi
          validated=""
          for attempt in 1 2 3; do
            validated=$(curl -s --max-time 10 -X POST https://honeycluster.io \
              -H 'content-type: application/json' \
              -d '{"method":"ledger","params":[{"ledger_index":"validated"}]}' \
              | grep -o '"ledger_index":[0-9]*' | head -1 | cut -d: -f2)
            [ -n "$validated" ] && break
            sleep 3
          done
          if [ -z "$validated" ]; then
            # Honeycluster temporär nicht lesbar: Kette trotzdem fortsetzen
            # (05.10.2026: ein Lese-Aussetzer stoppte die Kette ~8 min, während
            # die Schedule-Crons erneut schwiegen). Der Spin-Schutz oben fängt
            # dauerhafte Upstream-Fehler vorher ab; die Lag-Drossel greift beim
            # nächsten Tick mit lesbarer Validated-Abfrage.
            echo "validated nicht lesbar -> Kette fortsetzen (Drossel naechster Tick)"
            curl -s --max-time 10 -o /dev/null -w "dispatch HTTP %{http_code}\n" \
              -X POST \
              -H "Authorization: Bearer $CHAIN_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/advance-cron.yml/dispatches" \
              -d '{"ref":"main"}'
            exit 0
          fi
          lag=$((validated - cursor))
          echo "Lag: $lag Blöcke (cursor $cursor, validated $validated)"
          # Lag-Gate: Kette nur bei Rückstand > 300 Blöcke (~19 min bei ~16 Blöcken/min).
          if [ "$lag" -gt 300 ]; then
            curl -s --max-time 10 -o /dev/null -w "dispatch HTTP %{http_code}\n" \
              -X POST \
              -H "Authorization: Bearer $CHAIN_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/advance-cron.yml/dispatches" \
              -d '{"ref":"main"}'
          else
            echo "Lag <= 300 -> keine Kette (Crons halten die Kante)"
          fi
